name: Docker Image CI

on:
  release:
    types: [ released ]
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install docker cli (Alpine vs Debian differs)
        run: |
          apt-get update
          apt-get install -y docker.io
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Build version tagged Image'
        run: |
          docker build . --tag docker.io/maggiwuerze/xdccwebloader:${{ github.event.release.tag_name }} -f ./Dockerfile
          docker push docker.io/maggiwuerze/xdccwebloader:${{ github.event.release.tag_name }}

      - name: 'Build Latest Image'
        run: |
          docker build . --tag docker.io/maggiwuerze/xdccwebloader::latest -f ./Dockerfile
          docker build . --tag docker.io/maggiwuerze/xdccwebloader:latest