spring:
  application:
    name: xdccwebloader
  data:
    rest:
      base-path: /api
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: create
  datasource:
    url: "jdbc:h2:file:./data/demo"

springdoc:
  api-docs:
    version: OPENAPI_3_0

logging:
  level:
    org:
      pircbotx: ERROR